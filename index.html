<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de Fotos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2e2e2e;
    --accent: #e8c84a;
    --text: #f0ede6;
    --muted: #666;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 0.08em;
    color: var(--accent);
    line-height: 1;
  }

  header p {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .search-wrap {
    display: flex;
    gap: 0;
    width: 100%;
    max-width: 420px;
    margin-bottom: 48px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .search-wrap:focus-within {
    border-color: var(--accent);
  }

  #numInput {
    flex: 1;
    background: var(--surface);
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.1em;
    padding: 14px 20px;
    width: 100%;
  }

  #numInput::placeholder {
    color: var(--muted);
  }

  /* Chrome/Safari: ocultar flechas del input number */
  #numInput::-webkit-outer-spin-button,
  #numInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #numInput[type=number] { -moz-appearance: textfield; }

  #btnBuscar {
    background: var(--accent);
    border: none;
    cursor: pointer;
    padding: 14px 22px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    color: #000;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  #btnBuscar:hover { background: #f0d566; }
  #btnBuscar:active { transform: scale(0.96); }

  /* Zona de resultado */
  #resultado {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  #resultado.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #numLabel {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  #fotoWrap {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #fotoWrap img {
    width: 100%;
    height: auto;
    max-height: 72vh;
    object-fit: contain;
    display: block;
  }

  .not-found {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 60px 20px;
    color: var(--muted);
  }

  .not-found .icon {
    font-size: 3rem;
    line-height: 1;
    filter: grayscale(1);
  }

  .not-found p {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: #555;
  }

  .not-found small {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #444;
  }

  /* Hint de formatos */
  .hint {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>FOTOS</h1>
  <p>Escribe un número para mostrar la foto</p>
</header>

<div class="search-wrap">
  <input id="numInput" type="number" min="1" placeholder="Nº foto" autocomplete="off">
  <button id="btnBuscar">Buscar</button>
</div>
<div class="hint">Formatos aceptados: JPG · JPEG · PNG · WEBP · GIF</div>

<div id="resultado">
  <div id="numLabel"></div>
  <div id="fotoWrap"></div>
</div>

<script>
  const CARPETA = 'fotos';
  const EXTENSIONES = ['jpg', 'jpeg', 'png', 'webp', 'gif'];

  const input      = document.getElementById('numInput');
  const btnBuscar  = document.getElementById('btnBuscar');
  const resultado  = document.getElementById('resultado');
  const numLabel   = document.getElementById('numLabel');
  const fotoWrap   = document.getElementById('fotoWrap');

  function mostrarFoto(num) {
    const n = parseInt(num, 10);
    if (!num || isNaN(n) || n < 1) return;

    numLabel.textContent = `Foto nº ${n}`;
    fotoWrap.innerHTML = '';
    resultado.classList.remove('visible');

    // Intentamos cargar la imagen con cada extensión en orden
    probarExtension(n, 0);
  }

  function probarExtension(n, idx) {
    if (idx >= EXTENSIONES.length) {
      // Ninguna extensión funcionó → no encontrado
      mostrarNoEncontrado(n);
      mostrar();
      return;
    }

    const ext = EXTENSIONES[idx];
    const src = `${CARPETA}/${n}.${ext}`;
    const img = new Image();

    img.onload = () => {
      fotoWrap.innerHTML = '';
      fotoWrap.appendChild(img);
      mostrar();
    };

    img.onerror = () => {
      probarExtension(n, idx + 1);
    };

    img.alt = `Foto ${n}`;
    img.src = src;
  }

  function mostrarNoEncontrado(n) {
    fotoWrap.innerHTML = `
      <div class="not-found">
        <span class="icon">🗂️</span>
        <p>Fichero no encontrado</p>
        <small>No existe ninguna imagen con el número ${n}</small>
      </div>`;
  }

  function mostrar() {
    requestAnimationFrame(() => resultado.classList.add('visible'));
  }

  btnBuscar.addEventListener('click', () => mostrarFoto(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') mostrarFoto(input.value); });
</script>
</body>
</html>
